<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <mat-card class="w-full max-w-md">
    <mat-card-header>
      <mat-card-title>Reset Password</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="intro-copy">
        Choose a new password for your account. Reset links expire after 15 minutes.
      </p>

      <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>New Password</mat-label>
          <input matInput formControlName="password" type="password" />
          <mat-error
            *ngIf="
              resetPasswordForm.get('password')?.invalid &&
              resetPasswordForm.get('password')?.touched
            "
          >
            Password must be at least 6 characters
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full mt-4">
          <mat-label>Confirm New Password</mat-label>
          <input matInput formControlName="confirmPassword" type="password" />
          <mat-error
            *ngIf="
              resetPasswordForm.get('confirmPassword')?.invalid &&
              resetPasswordForm.get('confirmPassword')?.touched
            "
          >
            Please confirm your password
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="w-full mt-4"
          [disabled]="loading"
        >
          {{ loading ? 'Resetting password...' : 'Reset Password' }}
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <a mat-button routerLink="/login">Back to login</a>
    </mat-card-actions>
  </mat-card>
</div>
