<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <mat-card class="w-full max-w-md">
    <mat-card-header>
      <mat-card-title>Forgot Password</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="intro-copy">
        Enter your account email and we will generate a reset link for you right away.
      </p>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" />
          <mat-error
            *ngIf="
              forgotPasswordForm.get('email')?.invalid &&
              forgotPasswordForm.get('email')?.touched
            "
          >
            Please enter a valid email
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="w-full mt-4"
          [disabled]="loading"
        >
          {{ loading ? 'Generating link...' : 'Generate Reset Link' }}
        </button>
      </form>

      <div *ngIf="resetLink" class="reset-link-card">
        <p>Your reset link is ready for this local app setup.</p>
        <button mat-stroked-button color="primary" type="button" (click)="openResetLink()">
          Reset Password Now
        </button>
      </div>
    </mat-card-content>
    <mat-card-actions>
      <a mat-button routerLink="/login">Back to login</a>
    </mat-card-actions>
  </mat-card>
</div>
